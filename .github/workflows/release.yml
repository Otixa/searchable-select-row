name: Release

# Push a tag like v1.0.0 to publish. The tag, package.json and the VERSION
# constant in the card must all agree, or nothing is released.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          card=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' searchable-select-row.js)
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag card=$card package.json=$pkg"
          [ "$tag" = "$card" ] && [ "$tag" = "$pkg" ]

      - run: npm run check
      - run: npm test

      - name: Extract release notes
        run: |
          # The section of CHANGELOG.md under "## <version>", up to the next "## ".
          # Plain string comparison, so the dots in the version aren't regex.
          awk -v h="## ${GITHUB_REF_NAME#v}" '
            $0 == h || index($0, h " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md entry for ${GITHUB_REF_NAME#v}"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" searchable-select-row.js \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
